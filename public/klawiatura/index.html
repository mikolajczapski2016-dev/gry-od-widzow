<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klawiatura</title>
<style>
:root{font-family:Arial,sans-serif;color:#e9ebef;background:#17191d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(1120px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}h1{font-size:32px;margin:0 0 8px}p{margin:0;color:#a6adb8}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.sound{padding:12px;border:1px solid #555b65;border-radius:6px;background:#30343c;color:white}.keyboard{padding:18px;border-radius:12px;background:#25282d;border:1px solid #484d55;box-shadow:0 12px 0 #101114,0 20px 40px #0005}.row{display:flex;gap:6px;margin-bottom:9px}.row:last-child{margin-bottom:0}.key{flex:var(--width,1);min-width:0;height:clamp(32px,5.5vw,62px);padding:4px 2px;border:1px solid #616772;border-radius:5px;color:#f3f4f6;font-size:clamp(9px,1.3vw,15px);background:linear-gradient(#444a54,#343942);box-shadow:0 4px 0 #111318,inset 0 1px #ffffff20;transition:transform .07s,box-shadow .07s;user-select:none}.key.pressed,.key:active{transform:translateY(3px);box-shadow:0 1px 0 #111318;background:#5c6574}footer{text-align:center;margin-top:28px}a{color:#bbc9e2}button:focus-visible,a:focus-visible{outline:3px solid #a9c8ff;outline-offset:2px}@media(max-height:500px){body{padding:12px}header{margin-bottom:15px}h1{font-size:24px}.keyboard{padding:12px}.key{height:32px}.row{margin-bottom:7px}footer{margin-top:20px}}@media(max-width:500px){body{padding:10px}header{flex-wrap:wrap}.keyboard{padding:8px}.row{gap:3px}}@media(prefers-reduced-motion:reduce){.key{transition:none}}
</style>
</head>
<body>
<main>
<header><div><h1>Klawiatura</h1><p>Klikaj klawisze i słuchaj ich dźwięku.</p></div><button type="button" class="sound" id="sound" aria-pressed="true">Dźwięk: włączony</button></header>
<section class="keyboard" id="keyboard" aria-label="Klawiatura"></section>
<footer><a href="https://mikolajczapski2016-dev.github.io/gry-od-widzow/">← Wróć do listy gier</a></footer>
</main>
<script>
const keyboard=document.querySelector('#keyboard');
const soundButton=document.querySelector('#sound');
const timers=new WeakMap();
let sound=true,audio;
function clickSound(){
 if(!sound)return;
 try{
  audio??=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  const length=Math.ceil(audio.sampleRate*.035),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.005));
  const source=audio.createBufferSource(),gain=audio.createGain(),filter=audio.createBiquadFilter();
  source.buffer=buffer;filter.type='lowpass';filter.frequency.value=2800;gain.gain.value=.35;
  source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start();
 }catch{}
}
const rows=[
 ['Esc','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','Del'],
 ['`','1','2','3','4','5','6','7','8','9','0','-','=', ['Backspace',2]],
 [['Tab',1.5],'Q','W','E','R','T','Y','U','I','O','P','[',']',['\\',1.5]],
 [['Caps Lock',1.8],'A','S','D','F','G','H','J','K','L',';',"'",['Enter',2.2]],
 [['Shift',2.3],'Z','X','C','V','B','N','M',',','.','/',['Shift',2.7]],
 [['Ctrl',1.3],['Win',1.3],['Alt',1.3],['Spacja',6],['Alt',1.3],['Ctrl',1.3],'←','↑','↓','→']
];
for(const row of rows){
 const container=document.createElement('div');container.className='row';
 for(const item of row){
  const [label,width]=Array.isArray(item)?item:[item,1];
  const button=document.createElement('button');button.type='button';button.className='key';button.textContent=label;button.style.setProperty('--width',width);button.setAttribute('aria-label',label);
  button.addEventListener('click',()=>{
   button.classList.add('pressed');clearTimeout(timers.get(button));timers.set(button,setTimeout(()=>button.classList.remove('pressed'),150));clickSound();
  });
  container.append(button);
 }
 keyboard.append(container);
}
soundButton.addEventListener('click',()=>{sound=!sound;soundButton.textContent='Dźwięk: '+(sound?'włączony':'wyłączony');soundButton.setAttribute('aria-pressed',String(sound));});
</script>
<script src="../shared/landscape.js"></script>
</body>
</html>
